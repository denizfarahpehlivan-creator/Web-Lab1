<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact-Highest Mountains in the World</title>
  </head>
  <body>
    <header>
      <h1>Highest Mountains in the World</h1>
      <p>Explore the world's highest peaks</p>
      <nav>
        <ul>
          <li>
            <a href="index.html">Home</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
          <li>
            <a href="services.html">Services</a>
          </li>
          <li>
            <a href="contact.html">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h2>Share your favorite mountain</h2>

      <form>
        <fieldset>
          <legend><h3>Mountain Information</h3></legend>
          <table>
            <tbody>
              <tr>
                <td><label for="name">Name:</label></td>
                <td>
                  <input
                    type="text"
                    id="name"
                    placeholder="Please Enter your name"
                  />
                </td>
              </tr>

              <tr>
                <td><label for="email">E-mail:</label></td>
                <td>
                  <input
                    type="email"
                    id="email"
                    placeholder="Please Enter your E-mail"
                  />
                </td>
              </tr>

              <tr>
                <td><label for="mountain">Mountains:</label></td>
                <td>
                  <select name="mountain" id="mountain">
                    <option value="Options">Options</option>
                    <option value="Everest">Everest</option>
                    <option value="K2">K2</option>
                    <option value="Kangchenjunga">Kangchenjunga</option>
                    <option value="Lhotse">Lhotse</option>
                    <option value="Makalu">Makalu</option>
                  </select>
                </td>
              </tr>

              <tr>
                <td><label for="date">Date:</label></td>
                <td><input type="date" id="date" name="date" /></td>
              </tr>

              <tr>
                <td>
                  <label for="mesaj">Message:</label>

                  <textarea name="mesaj" id="mesaj"></textarea>
                </td>
              </tr>

              <tr>
                <td><button type="submit">submit</button></td>
              </tr>
            </tbody>
          </table>
        </fieldset>
      </form>
    </main>

    <footer>&copy;Deniz Pehlivan 2026</footer>
  </body>
</html>
